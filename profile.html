<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>GraphQL Profile - Dashboard</title>

  <link
    rel="stylesheet"
    href="css/profile.css"
  />
</head>


<body>

  <!-- ==========================================
       HEADER
  =========================================== -->

  <header class="topbar">

    <div class="brand-area">

      <p class="eyebrow">
        GraphQL Profile
      </p>

      <h1>
        Student Dashboard
      </h1>

    </div>


    <div class="header-actions">

      <span id="header-login">
        Loading...
      </span>

      <button
        id="logout-btn"
        type="button"
        class="logout-button"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- ==========================================
       MAIN
  =========================================== -->

  <main class="dashboard">


    <!-- ========================================
         PROFILE HERO
    ========================================= -->

    <section class="hero-card">

      <div class="profile-info">

        <div
          id="avatar-char"
          class="avatar"
        >
          ?
        </div>


        <div>

          <p class="eyebrow">
            Student
          </p>

          <h2 id="user-login">
            Loading...
          </h2>

          <p
            id="user-id"
            class="muted"
          >
            -
          </p>

        </div>

      </div>


      <div class="hero-stats">

        <div class="stat">

          <span class="stat-label">
            Total XP
          </span>

          <strong id="total-xp">
            0 B
          </strong>

        </div>


        <div class="stat">

          <span class="stat-label">
            Audit Ratio
          </span>

          <strong id="audit-ratio">
            0.0
          </strong>

        </div>


        <div class="stat">

          <span class="stat-label">
            Current Level
          </span>

          <strong id="user-level">
            0
          </strong>

        </div>

      </div>

    </section>


    <!-- ========================================
         SUMMARY CARDS
    ========================================= -->

    <section class="summary-grid">


      <article class="card">

        <p class="card-label">
          XP Given
        </p>

        <strong id="audit-up">
          0 B
        </strong>

      </article>


      <article class="card">

        <p class="card-label">
          XP Received
        </p>

        <strong id="audit-down">
          0 B
        </strong>

      </article>


      <article class="card">

        <p class="card-label">
          Projects Passed
        </p>

        <strong
          id="projects-passed"
          class="success"
        >
          0
        </strong>

      </article>


      <article class="card">

        <p class="card-label">
          Projects Failed
        </p>

        <strong
          id="projects-failed"
          class="danger"
        >
          0
        </strong>

      </article>


    </section>


    <!-- ========================================
         GRAPHS
    ========================================= -->

    <section class="graphs-grid">


      <!-- XP PROJECT GRAPH -->

      <article class="graph-card graph-wide">

        <div class="graph-heading">

          <div>

            <p class="eyebrow">
              Projects
            </p>

            <h2>
              XP Added Per Project
            </h2>

          </div>

        </div>


        <svg
          id="xp-project-graph"
          viewBox="0 0 900 420"
          class="chart-svg"
          role="img"
          aria-label="XP added per project chart"
        ></svg>

      </article>


      <!-- AUDIT GRAPH -->

      <article class="graph-card">

        <div class="graph-heading">

          <div>

            <p class="eyebrow">
              Audits
            </p>

            <h2>
              Audit Ratio
            </h2>

          </div>

        </div>


        <svg
          id="audit-ratio-graph"
          viewBox="0 0 520 420"
          class="chart-svg"
          role="img"
          aria-label="Audit ratio chart"
        ></svg>

      </article>


    </section>


    <!-- ========================================
         ERROR
    ========================================= -->

    <p
      id="global-error"
      class="error-message"
      aria-live="polite"
    ></p>


  </main>


  <!-- ==========================================
       JAVASCRIPT
  =========================================== -->

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>

</body>

</html>
