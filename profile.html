<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GraphQL Profile - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page page-profile">
    <header class="topbar">
      <div>
        <p class="eyebrow">GraphQL Profile</p>
        <h1 class="topbar-title">Dashboard</h1>
        <p class="topbar-subtitle">Welcome back, <span id="user-login">Loading...</span></p>
      </div>
      <button id="logout-btn" class="btn btn-secondary">Logout</button>
    </header>

    <main class="dashboard">
      <section class="summary-grid" aria-label="Profile summary">
        <article class="card hero-card">
          <p class="eyebrow">Student</p>
          <h2 id="user-login-card">-</h2>
          <p>User ID <span id="user-id">-</span></p>
        </article>

        <article class="card metric-card">
          <p class="metric-label">Total XP</p>
          <strong id="total-xp">0</strong>
          <span>earned from completed project XP</span>
        </article>

        <article class="card metric-card">
          <p class="metric-label">Audit Ratio</p>
          <strong id="audit-ratio">0.00</strong>
          <span><span id="audit-up">0</span> up / <span id="audit-down">0</span> down</span>
        </article>
      </section>

      <section class="graphs-section" aria-label="Dashboard charts">
        <article class="card graph-card graph-card-wide">
          <div class="card-heading">
            <div>
              <p class="eyebrow">Projects</p>
              <h2 class="section-title">XP Added Per Project</h2>
            </div>
          </div>
          <svg
            id="xp-project-graph"
            viewBox="0 0 900 420"
            class="graph-svg"
            role="img"
            aria-label="XP added per project chart"
          ></svg>
        </article>

        <article class="card graph-card">
          <div class="card-heading">
            <div>
              <p class="eyebrow">Audits</p>
              <h2 class="section-title">Audit Ratio</h2>
            </div>
          </div>
          <svg
            id="audit-ratio-graph"
            viewBox="0 0 520 420"
            class="graph-svg"
            role="img"
            aria-label="Audit ratio chart"
          ></svg>
        </article>
      </section>

      <p id="global-error" class="error-message page-error" aria-live="polite"></p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/graphs.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
