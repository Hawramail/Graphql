<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GraphQL Profile - Login</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page page-login">
    <main class="login-wrapper">
      <section class="card login-card">
        <h1 class="title">GraphQL Profile</h1>
        <p class="subtitle">Sign in with your username or email</p>

        <form id="login-form" class="form" novalidate>
          <label for="identifier" class="label">Username or Email</label>
          <input
            id="identifier"
            name="identifier"
            type="text"
            class="input"
            placeholder="username or email"
            autocomplete="username"
            required
          />

          <label for="password" class="label">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="input"
            placeholder="password"
            autocomplete="current-password"
            required
          />

          <button type="submit" class="btn btn-primary">Login</button>
          <p id="login-error" class="error-message" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
