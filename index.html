<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GraphQL Profile - Sign In</title>

  <link
    rel="stylesheet"
    href="css/login.css"
  >
</head>


<body>

  <main class="login-page">

    <section class="login-card">

      <div class="brand">
        <span class="brand-badge">01</span>

        <div>
          <p class="eyebrow">
            Reboot Profile
          </p>

          <h1>
            Welcome back
          </h1>
        </div>
      </div>


      <div class="login-form">

        <div class="form-group">
          <label for="identifier">
            Username or Email
          </label>

          <input
            id="identifier"
            type="text"
            placeholder="username or email"
            autocomplete="username"
            maxlength="50"
          >
        </div>


        <div class="form-group">
          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            maxlength="128"
          >
        </div>


        <div
          id="error-msg"
          class="error-message hidden"
        ></div>


        <button
          id="login-btn"
          class="login-button"
          type="button"
        >
          <span id="btn-text">
            Sign In
          </span>

          <span
            id="btn-loader"
            class="hidden"
          >
            Signing in...
          </span>
        </button>

      </div>

    </section>

  </main>


  <script src="js/config.js"></script>
  <script src="js/login.js"></script>

</body>

</html>
