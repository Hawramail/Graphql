<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>GraphQL Profile - Login</title>

  <link
    rel="stylesheet"
    href="css/login.css"
  />
</head>


<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-heading">

        <p class="eyebrow">
          GraphQL Profile
        </p>

        <h1>
          Student Login
        </h1>

        <p class="subtitle">
          Sign in with your username or email
        </p>

      </div>


      <form
        id="login-form"
        class="login-form"
      >

        <div class="form-group">

          <label for="identifier">
            Username or Email
          </label>

          <input
            id="identifier"
            name="identifier"
            type="text"
            placeholder="username or email"
            autocomplete="username"
            required
          />

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="password"
            autocomplete="current-password"
            required
          />

        </div>


        <p
          id="error-msg"
          class="error-message hidden"
          aria-live="polite"
        ></p>


        <button
          type="button"
          id="login-btn"
          class="login-button"
        >
          <span id="btn-text">Sign In</span>
          <span id="btn-loader" class="hidden">Signing in&hellip;</span>
        </button>

      </form>

    </section>

  </main>


  <script src="js/config.js"></script>
  <script src="js/login.js"></script>

</body>

</html>
